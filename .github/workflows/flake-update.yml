# Automatic flake updates
#
# The `Update flake lock` GitHub Actions workflow runs daily at 03:17 UTC
# and can also be started manually from the Actions tab. Scheduled runs may
# be delayed by GitHub.
#
# It updates inputs using GitHub snapshots, discovers every entry in
# `nixosConfigurations`, and builds each configuration's
# `config.system.build.toplevel`. It commits
# only `flake.lock` to the default branch after all builds succeed, and only
# when the lock file changed. Failed updates or builds leave the branch unchanged.
# This verifies builds, not booting or runtime behavior.
# If the default branch advances during the run, the validated lock is not
# pushed onto untested changes. A new workflow run is dispatched against the
# latest default branch instead, including when a push loses this race.
#
# Before installing Nix, the workflow creates a sparse Btrfs image with
# `compress=zstd:3`. Its logical size is the available space on the host
# filesystem minus a 6 GiB budget for host logs and runner bookkeeping.
# It fails early if fewer than 4 GiB remain for the image. Physical allocation
# grows as data is written; this does not add capacity or reserve host space
# against other writers. Zstd level 3 balances compression and CPU
# cost; already-compressed data such as Git packfiles may shrink very little.
#
# The image is mounted at `/mnt/nix-ci`. Separate directories are bind-mounted
# at `/nix` and `$XDG_CACHE_HOME`, while Nix builds use `/mnt/nix-ci/build`.
# The store, fetcher cache, and build temporaries share compressed space
# without putting the fetcher cache or build temporaries in the store archive.
# The original RUNNER_TEMP directory is bind-mounted from Btrfs after copying
# its existing runner files. RUNNER_* variables cannot be overridden through
# workflow env. The image is outside that directory so it is never hidden or
# copied into itself. TMPDIR also points inside Btrfs. Before restoring, a
# dedicated step verifies the actual filesystems and device IDs of all paths.
# Archives and extracted files must fit in Btrfs simultaneously;
# already-compressed archives benefit little from filesystem compression.
# RUNNER_TEMP holds result symlinks and runner files outside cached /nix.
# Only directory contents are cached, never the image file. Mounts remain
# available through all action post-steps until the ephemeral runner is removed.
# The setup requires passwordless sudo, loop devices, and Btrfs kernel support
# on the Ubuntu runner. No preinstalled toolchains are removed.
#
# Nix automatically attempts garbage collection below 1 GiB of free space,
# aiming for 3 GiB free when enough unreferenced paths can be deleted. This
# cannot remove live dependencies or guarantee that a build fits. Disk usage
# is reported after mounting and at the end of the job, including on failure.
#
# `.github/scripts/update-flake-lock.mts` evaluates the declared inputs and
# overrides GitHub Git URLs with snapshot URLs for a single flake update.
# It restores Git transport in the generated lock, retaining the pinned
# revisions, content hashes, timestamps, and original refs. An offline metadata
# check rejects locks that would require updates. Builds use this final Git
# lock without overrides, reusing the sources downloaded from snapshots.
# Unsupported Git URL options are rejected rather than silently discarded.
# The local fetcher cache is ephemeral; Git repositories are not cached in
# GitHub Actions. Only the Nix store is restored and saved between runs.
#
# The Nix store is cached using `nix-community/cache-nix-action`,
# which handles both store paths and the Nix database. Each configuration is
# built with its own result symlink under `$RUNNER_TEMP/nixos-results`, making
# all current system outputs garbage collection roots. After every system
# build succeeds, `nix store gc` removes unreferenced paths before the store
# is saved under a new cache key. Failed builds do not save a new store cache.
#
# Result symlinks are outside the cached `/nix` directory, so previous runs'
# system outputs do not remain rooted on a fresh runner. No NixOS generations
# are installed. Garbage collection retains the current systems' runtime
# closures and other live roots required by the Nix installation. It does not
# retain derivations or build-only dependencies solely to accelerate rebuilds
# (`keep-derivations` and `keep-outputs` are disabled during collection).
#
# This bounds the saved store to live roots, not to a fixed number of bytes:
# the current systems can still be large. Old GitHub cache archives are
# subject to GitHub's retention and quota eviction policies. Restoring and
# saving the entire store also adds transfer time and requires disk space.
# Cache keys are unique per run because Actions caches are immutable; a
# shared restore prefix selects the most recently created cache.
#
# The workflow uses the built-in `GITHUB_TOKEN` with `contents: write` and
# `actions: write`; no additional secret is required. Actions write access
# allows dispatching a fresh validation when the branch advances.
# Repository policies must allow Actions to
# push to the default branch. Branch protection requiring pull requests will
# block this direct-commit workflow.
#
# Full desktop builds may exceed a hosted runner's available disk space or
# the six-hour job limit. In that case, use a larger or self-hosted runner.

name: Update flake lock

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      XDG_CACHE_HOME: /tmp/nix-cache
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Prepare compressed Btrfs volume
        run: |
          if [[ -e /nix/store ]] || mountpoint -q /nix; then
            echo "::error::The Btrfs volume must be prepared before Nix is installed."
            exit 1
          fi
          sudo -n apt-get update
          sudo -n apt-get install --yes --no-install-recommends btrfs-progs
          image="$(dirname "$RUNNER_TEMP")/nix-ci.btrfs"
          available_bytes="$(df --output=avail -B1 "$(dirname "$image")" | tail -n 1)"
          image_bytes=$((available_bytes - 6 * 1024 * 1024 * 1024))
          if (( image_bytes < 4 * 1024 * 1024 * 1024 )); then
            echo "::error::Insufficient disk space for Btrfs while reserving 6 GiB for the host."
            exit 1
          fi
          truncate --size "$image_bytes" "$image"
          mkfs.btrfs --label nix-ci "$image"
          sudo -n mkdir -p /mnt/nix-ci /nix "$XDG_CACHE_HOME"
          sudo -n mount -o loop,compress=zstd:3,noatime "$image" /mnt/nix-ci
          sudo -n mkdir -p /mnt/nix-ci/nix /mnt/nix-ci/fetch-cache /mnt/nix-ci/build
          sudo -n mkdir -p /mnt/nix-ci/runner-temp
          sudo -n cp -a "$RUNNER_TEMP/." /mnt/nix-ci/runner-temp/
          sudo -n chown "$(id -u):$(id -g)" /mnt/nix-ci/fetch-cache
          sudo -n chown "$(id -u):$(id -g)" /mnt/nix-ci/runner-temp
          sudo -n chmod 0755 /mnt/nix-ci/build
          sudo -n mount --bind /mnt/nix-ci/nix /nix
          sudo -n mount --bind /mnt/nix-ci/fetch-cache "$XDG_CACHE_HOME"
          sudo -n mount --bind /mnt/nix-ci/runner-temp "$RUNNER_TEMP"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          df -h "$(dirname "$image")" /nix "$XDG_CACHE_HOME" "$RUNNER_TEMP"
          stat --format='Image: %s bytes logical, %b blocks of %B bytes allocated' "$image"
          sudo -n btrfs filesystem usage /mnt/nix-ci

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            build-dir = /mnt/nix-ci/build
            min-free = 1073741824
            max-free = 3221225472
            keep-derivations = false
            keep-outputs = false
            http2 = false

      - name: Verify compressed storage
        run: |
          filesystem_device="$(stat --format=%d /mnt/nix-ci)"
          printf 'RUNNER_TEMP=%s\nTMPDIR=%s\n' "$RUNNER_TEMP" "$TMPDIR"
          for path in /nix "$XDG_CACHE_HOME" "$RUNNER_TEMP" "$TMPDIR" /mnt/nix-ci/build; do
            findmnt --target "$path" --output TARGET,SOURCE,FSTYPE,OPTIONS
            if [[ "$(findmnt --noheadings --output FSTYPE --target "$path")" != btrfs || "$(stat --format=%d "$path")" != "$filesystem_device" ]]; then
              echo "::error::$path is not backed by the expected Btrfs image."
              exit 1
            fi
          done
          df -h "$(dirname "$RUNNER_TEMP")" /nix "$RUNNER_TEMP"

      - name: Restore Nix store
        id: store-cache
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: ${{ runner.os }}-nix-store-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-prefixes-first-match: |
            ${{ runner.os }}-nix-store-v1-

      - name: Update flake inputs from snapshots
        run: node .github/scripts/update-flake-lock.mts

      - name: Build every NixOS configuration
        run: |
          configurations="$(nix eval --no-update-lock-file --json .#nixosConfigurations --apply builtins.attrNames)"
          mapfile -t systems < <(jq -r '.[]' <<< "$configurations")
          mkdir -p "$RUNNER_TEMP/nixos-results"
          for system in "${systems[@]}"; do
            echo "::group::Build $system"
            nix build --no-update-lock-file --out-link "$RUNNER_TEMP/nixos-results/$system" --print-build-logs ".#nixosConfigurations.${system}.config.system.build.toplevel"
            echo "::endgroup::"
          done

      - name: Collect unused Nix store paths
        run: nix store gc --option keep-derivations false --option keep-outputs false

      - name: Save cleaned Nix store
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: ${{ steps.store-cache.outputs.primary-key }}

      - name: Commit validated lock file
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          validated_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)"
          if [[ "$remote_head" != "$validated_head" ]]; then
            echo "::notice::The default branch advanced; restarting validation without publishing this lock."
            echo "restart=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet -- flake.lock; then
            echo "No lock file changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flake.lock
          git commit -m "chore: update flake.lock"
          if git push origin "HEAD:$DEFAULT_BRANCH"; then
            exit 0
          fi
          remote_head="$(git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH" | cut -f1)"
          if [[ "$remote_head" != "$validated_head" ]]; then
            echo "::notice::The default branch changed during publication; restarting validation."
            echo "restart=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Push failed without a change to the default branch."
          exit 1

      - name: Restart validation on updated branch
        if: steps.commit.outputs.restart == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run flake-update.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"

      - name: Report disk usage
        if: always()
        run: |
          df -h "$(dirname "$RUNNER_TEMP")" "$RUNNER_TEMP"
          image="$(dirname "$RUNNER_TEMP")/nix-ci.btrfs"
          if [[ -f "$image" ]]; then
            stat --format='Image: %s bytes logical, %b blocks of %B bytes allocated' "$image"
          fi
          if mountpoint -q /mnt/nix-ci; then
            sudo -n btrfs filesystem usage /mnt/nix-ci
          fi