name: Update flake lock

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update flake inputs
        run: nix flake update

      - name: Build every NixOS configuration
        run: |
          configurations="$(nix eval --no-update-lock-file --json .#nixosConfigurations --apply builtins.attrNames)"
          mapfile -t systems < <(jq -r '.[]' <<< "$configurations")
          for system in "${systems[@]}"; do
            echo "::group::Build $system"
            nix build --no-update-lock-file --no-link --print-build-logs ".#nixosConfigurations.${system}.config.system.build.toplevel"
            echo "::endgroup::"
          done

      - name: Commit validated lock file
        run: |
          if git diff --quiet -- flake.lock; then
            echo "No lock file changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flake.lock
          git commit -m "chore: update flake.lock"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"